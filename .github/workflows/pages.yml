# Publish the app to GitHub Pages.
#
# The site is a single file, so the "build" is just running the bundler and
# renaming its output to index.html. There is nothing to install: the bundler
# has no dependencies.
#
# One-time setup in the repository: Settings -> Pages -> Source -> GitHub
# Actions. After that every push to a branch below republishes the site.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/holdem-learning-platform-ykqo74
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the test suite
        run: npm test

      - name: Build the single-file app
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/holdem-dojo.html _site/index.html
          # A copy under its own name, so the page can offer itself as a
          # download for offline use.
          cp dist/holdem-dojo.html _site/holdem-dojo.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
